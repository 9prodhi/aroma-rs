source_lines = [139, 155]
query = """
    projectStatusPicklistValues({ data, error }) {
        if (data) {
            this.statusTabs = data.values.map(val => ({
                label: val.label,
                value: val.value,
                projects: []
            }));

            this.splitProjectsByStatus();
        } else if (error) {
            console.error('Error loading picklist values:', error);
        }
    }
"""
