    fileToUpload.PathOnClient = files.fileName;
    fileToUpload.Title = files.fileName;
    fileToUpload.VersionData = files.fileContents;
    fileToUpload.FirstPublishLocationId = files.attachedTo;
    filesToCreate.add(fileToUpload);
}
