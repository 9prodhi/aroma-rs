[workspace]
resolver = "2"
members = ["crates/aroma-core", "crates/aroma-lang", "crates/aroma-cli", "xtask"]
exclude = ["concepts/aroma-concepts"]

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
aroma-core = { path = "crates/aroma-core" }
aroma-lang = { path = "crates/aroma-lang" }
# Grammar crates are pinned exactly: labels, kinds and feature ids depend on them.
tree-sitter = "=0.25.10"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-xml = "=0.7.0"
tree-sitter-sfapex = "=3.0.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
postcard = { version = "1.1.1", features = ["use-std"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
memmap2 = "0.9.5"
bytemuck = { version = "1.22.0", features = ["derive"] }
blake3 = "1.8.2"
fd-lock = "4.0.4"
rayon = "1.10.0"
ignore = "0.4.23"
clap = { version = "4.5.37", features = ["derive"] }
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
toml = "0.8.22"
insta = { version = "1.43.1", features = ["json"] }
proptest = "1.6.0"
assert_cmd = "2.0.17"
tempfile = "3.19.1"
